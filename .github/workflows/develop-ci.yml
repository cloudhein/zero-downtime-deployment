name: react-app-express-js-ci-cd-develop-branch

on:
  push:
    branches:
      - develop

env:
  NODE-VERSION: 20
  AWS_REGION: ap-northeast-1

jobs:
  repo-meta:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.container-image.outputs.IMAGE_NAME }}
      repo_name: ${{ steps.repository-name.outputs.REPO_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract repository's name
        id: repository-name
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d '/' -f 2)
          echo "REPO_NAME=${REPO_NAME}" >> $GITHUB_OUTPUT

      - name: Create image name
        id: container-image
        run: |
          BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/\//_/g')
          IMAGE_NAME=${BRANCH_NAME}_${{ github.sha }}
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_OUTPUT

  format_code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.3.0
        with:
          node-version: ${{ env.NODE-VERSION }}

      - name: Install dependencies
        working-directory: ./express-backend
        run: npm install
        

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ./express-backend/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('./express-backend/package-lock.json', './express-backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      - name: Format code
        working-directory: ./express-backend
        run: npx prettier --write .

      - name: Push code
        working-directory: ./express-backend
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

          if [[ $(git status --porcelain) ]]; then
            if ! git add .; then
              echo "Error: Failed to stage files"
              exit 1
            fi

            if ! git commit -m "Updated from ref: ${{ github.sha }}"; then
              echo "Error: Failed to commit files"
              exit 1
            fi

            if ! git push 2>&1 | tee push.log; then
              if grep -q "403" push.log; then
                echo "Error: Permission denied (HTTP 403). Exiting."
                exit 1
              fi

              if ! git pull --rebase && git push; then
                echo "Error: failed to push the code after rebase."
                exit 1
              fi
            fi
          else
            echo "Nothing to commit."
          fi
  

  unit-tests:
    runs-on: ubuntu-latest
    needs: format_code

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.3.0
        with:
          node-version: ${{ env.NODE-VERSION }}

      - name: Restore node_modules caches
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ./express-backend/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('./express-backend/package-lock.json', './express-backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ./express-backend
        run: npm install

      - name: Run unit tests
        working-directory: ./express-backend
        run: npm test

      - name: Create issue on test failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_TIMESTAMP: ${{ github.event.pull_request.updated_at }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            COMMIT_INFO="**PR Title:** $PR_TITLE\n\n**PR Author:** $PR_USER\n\n**Timestamp:** $PR_TIMESTAMP"
          else
            COMMIT_INFO="**Commit Message:** $COMMIT_MESSAGE\n\n**Timestamp:** $COMMIT_TIMESTAMP"
          fi

          ISSUE_BODY=$(cat <<EOF
          {
            "title": "❌ Unit Test Failure in CI/CD Pipeline",
            "body": "**Author:** $ACTOR\n\n**Commit SHA:** $SHA\n\n**Event Type:** $EVENT_NAME\n\n$COMMIT_INFO\n\n**Run URL:** $RUN_URL\n\nPlease investigate the failing tests and fix accordingly right away."
          }
          EOF
          )

          curl -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$REPO/issues \
            -d "$ISSUE_BODY"

  sonarqube-analysis:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: ${{ env.NODE-VERSION }}

      - name: Restore node_modules caches
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ./express-backend/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('./express-backend/package-lock.json', './express-backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ./express-backend
        run: npm install

      - name: Official SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: ./express-backend
          args: >
            -Dsonar.projectKey=react-express
            -Dsonar.organization=react-express
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**,tests/**
            -Dsonar.verbose=true
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info


  