name: react-app-express-js-ci-cd-main-branch

on:
  push:
    branches:
      - main

env:
  NODE-VERSION: 20
  AWS_REGION: ap-southeast-1 # Change to your desired AWS region

jobs:
  repo-meta:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.container-image.outputs.IMAGE_NAME }}
      repo_name: ${{ steps.repository-name.outputs.REPO_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract repository's name
        id: repository-name
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d '/' -f 2)
          echo "REPO_NAME=${REPO_NAME}" >> $GITHUB_OUTPUT

      - name: Create image name
        id: container-image
        run: |
          BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/\//_/g')
          IMAGE_NAME=${BRANCH_NAME}_${{ github.sha }}
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_OUTPUT

  format_code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.3.0
        with:
          node-version: ${{ env.NODE-VERSION }}

      - name: Install dependencies
        working-directory: ./express-backend
        run: npm install
        

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ./express-backend/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('./express-backend/package-lock.json', './express-backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      - name: Format code
        working-directory: ./express-backend
        run: npx prettier --write .

      - name: Push code
        working-directory: ./express-backend
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

          if [[ $(git status --porcelain) ]]; then
            if ! git add .; then
              echo "Error: Failed to stage files"
              exit 1
            fi

            if ! git commit -m "Updated from ref: ${{ github.sha }}"; then
              echo "Error: Failed to commit files"
              exit 1
            fi

            if ! git push 2>&1 | tee push.log; then
              if grep -q "403" push.log; then
                echo "Error: Permission denied (HTTP 403). Exiting."
                exit 1
              fi

              if ! git pull --rebase && git push; then
                echo "Error: failed to push the code after rebase."
                exit 1
              fi
            fi
          else
            echo "Nothing to commit."
          fi
  

  unit-tests:
    runs-on: ubuntu-latest
    needs: format_code

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.3.0
        with:
          node-version: ${{ env.NODE-VERSION }}

      - name: Restore node_modules caches
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ./express-backend/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('./express-backend/package-lock.json', './express-backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ./express-backend
        run: npm install

      - name: Run unit tests
        working-directory: ./express-backend
        run: npm test

      - name: Create issue on test failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_TIMESTAMP: ${{ github.event.pull_request.updated_at }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            COMMIT_INFO="**PR Title:** $PR_TITLE\n\n**PR Author:** $PR_USER\n\n**Timestamp:** $PR_TIMESTAMP"
          else
            COMMIT_INFO="**Commit Message:** $COMMIT_MESSAGE\n\n**Timestamp:** $COMMIT_TIMESTAMP"
          fi

          ISSUE_BODY=$(cat <<EOF
          {
            "title": "❌ Unit Test Failure in CI/CD Pipeline",
            "body": "**Author:** $ACTOR\n\n**Commit SHA:** $SHA\n\n**Event Type:** $EVENT_NAME\n\n$COMMIT_INFO\n\n**Run URL:** $RUN_URL\n\nPlease investigate the failing tests and fix accordingly right away."
          }
          EOF
          )

          curl -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$REPO/issues \
            -d "$ISSUE_BODY"

  sonarqube-backend-analysis:
    name: SonarQube Scan to Backend
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Official SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: ./express-backend
          args: >
            -Dsonar.projectKey=react-express-key
            -Dsonar.organization=react-express
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**,tests/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.projectVersion=1.0.${{ github.run_number }}
    
      - name: Wait for Quality Gate result
        id: qualitygate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          sleep 10 # allow background tasks to complete
          ANALYSIS_ID=$(curl -s -u $SONAR_TOKEN: "$SONAR_HOST_URL/api/ce/component?component=react-express-key" | jq -r '.queue[0].id')
          STATUS=""
          for i in {1..10}; do
            STATUS=$(curl -s -u $SONAR_TOKEN: "$SONAR_HOST_URL/api/ce/task?id=$ANALYSIS_ID" | jq -r '.task.status')
            if [ "$STATUS" = "SUCCESS" ]; then
              break
            fi
            echo "Waiting for SonarQube analysis to complete..."
            sleep 5
          done

          QUALITY_GATE_STATUS=$(curl -s -u $SONAR_TOKEN: "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=react-express-key" | jq -r '.projectStatus.status')
          echo "Quality Gate Status: $QUALITY_GATE_STATUS"
        
          if [ "$QUALITY_GATE_STATUS" != "OK" ]; then
            echo "❌ Quality Gate failed"
            exit 1
          else
            echo "✅ Quality Gate passed"
          fi

  sonarqube-fronend-analysis:
    name: SonarQube Scan to Frontend
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Official SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: ./react-frontend
          args: >
            -Dsonar.projectKey=react-key
            -Dsonar.organization=react-express
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**,tests/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.projectVersion=1.0.${{ github.run_number }}
    
      - name: Wait for Quality Gate result
        id: qualitygate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          sleep 10 # allow background tasks to complete
          ANALYSIS_ID=$(curl -s -u $SONAR_TOKEN: "$SONAR_HOST_URL/api/ce/component?component=react-key" | jq -r '.queue[0].id')
          STATUS=""
          for i in {1..10}; do
            STATUS=$(curl -s -u $SONAR_TOKEN: "$SONAR_HOST_URL/api/ce/task?id=$ANALYSIS_ID" | jq -r '.task.status')
            if [ "$STATUS" = "SUCCESS" ]; then
              break
            fi
            echo "Waiting for SonarQube analysis to complete..."
            sleep 5
          done

          QUALITY_GATE_STATUS=$(curl -s -u $SONAR_TOKEN: "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=react-key" | jq -r '.projectStatus.status')
          echo "Quality Gate Status: $QUALITY_GATE_STATUS"
        
          if [ "$QUALITY_GATE_STATUS" != "OK" ]; then
            echo "❌ Quality Gate failed"
            exit 1
          else
            echo "✅ Quality Gate passed"
          fi

  containerize-backend:
    runs-on: ubuntu-latest
    needs: [repo-meta,sonarqube-backend-analysis]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to JFrog
        uses: docker/login-action@v3
        with:
          username: ${{ vars.JFROG_USERNAME }}
          password: ${{ secrets.JFROG_TOKEN }}
          registry: ${{ vars.JFROG_REGISTRY }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # if use with uses in github action, working-directory cannot define and must use with context
       # Build image locally, but don't push yet
      - name: Build Docker image (local only)
        run: docker build -t ${{ vars.JFROG_REGISTRY }}/expressjs-backend/express:${{ needs.repo-meta.outputs.image_name }} ./express-backend
        
      - name: Scan image in a private registry
        id: trivy-scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ vars.JFROG_REGISTRY }}/expressjs-backend/express:${{ needs.repo-meta.outputs.image_name }}
          scan-type: image
          severity: 'CRITICAL'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln,secret'

      - name: Push Docker images
        # Only push if the scan was successful
        if: steps.trivy-scan.outcome == 'success'
        run: docker push ${{ vars.JFROG_REGISTRY }}/expressjs-backend/express:${{ needs.repo-meta.outputs.image_name }}

   # deploy backend app
  deploy-backend-app:
    runs-on: ubuntu-latest
    outputs:
      backend_lb_dns_name: ${{ steps.extract_lb.outputs.backend_lb_dns_name }}
 
    needs: [containerize-backend]
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
 
      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
 
      - name: Terraform Init
        working-directory: ./deploy-backend
        run: terraform init
 
      - name: Terraform Plan
        working-directory: ./deploy-backend
        run: |
          terraform fmt
          terraform validate
          terraform plan -var 'JFROG_REGISTRY=${{ vars.JFROG_REGISTRY }}' -var 'JFROG_USER=${{ vars.JFROG_USERNAME }}' -var 'JFROG_TOKEN=${{ secrets.JFROG_TOKEN }}' -var 'run_number=${{ github.run_number }}' -var 'docker_image=${{ vars.JFROG_REGISTRY }}/expressjs-backend/express:${{ needs.repo-meta.outputs.image_name }}'
 
      - name: Deploy backend app
        working-directory: ./deploy-backend
        run: |
          terraform apply -auto-approve -var 'JFROG_REGISTRY=${{ vars.JFROG_REGISTRY }}' -var 'JFROG_USER=${{ vars.JFROG_USERNAME }}' -var 'JFROG_TOKEN=${{ secrets.JFROG_TOKEN }}' -var 'run_number=${{ github.run_number }}' -var 'docker_image=${{ vars.JFROG_REGISTRY }}/expressjs-backend/express:${{ needs.repo-meta.outputs.image_name }}'

      - name: Extract LB DNS output
        id: extract_lb
        working-directory: ./deploy-backend
        run: |
          dns=$(terraform output -raw backend_lb_dns_name)
          echo "backend_lb_dns_name=${dns}" >> $GITHUB_OUTPUT

  containerize-frontend:
    runs-on: ubuntu-latest
    env:
      backend_ip: ${{ needs.deploy-backend-app.outputs.backend_lb_dns_name }}

    needs: [repo-meta,deploy-backend-app]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update .env file with backend LB DNS
        working-directory: ./react-frontend
        run: |
          sudo sed -i "s/^REACT_APP_SERVER_IP=.*$/REACT_APP_SERVER_IP=${{ env.backend_ip }}/" .env

      - name: Authenticate to JFrog
        uses: docker/login-action@v3
        with:
          username: ${{ vars.JFROG_USERNAME }}
          password: ${{ secrets.JFROG_TOKEN }}
          registry: ${{ vars.JFROG_REGISTRY }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (local only)
        run: docker build -t ${{ vars.JFROG_REGISTRY }}/react-frontend/react:${{ needs.repo-meta.outputs.image_name }} ./react-frontend/

      - name: Scan image in a private registry
        id: trivy-scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ vars.JFROG_REGISTRY }}/react-frontend/react:${{ needs.repo-meta.outputs.image_name }}
          scan-type: image
          severity: 'CRITICAL'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln,secret'
      
      - name: Push Docker images
        # Only push if the scan was successful
        if: steps.trivy-scan.outcome == 'success'
        run: docker push ${{ vars.JFROG_REGISTRY }}/react-frontend/react:${{ needs.repo-meta.outputs.image_name }}

  deploy-frontend-app:
    runs-on: ubuntu-latest
 
    needs: [containerize-frontend]
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
 
      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
 
      - name: Terraform Init
        working-directory: ./deploy-frontend
        run: terraform init
 
      - name: Terraform Plan
        working-directory: ./deploy-frontend
        run: |
          terraform fmt
          terraform validate
          terraform plan -var 'JFROG_REGISTRY=${{ vars.JFROG_REGISTRY }}' -var 'JFROG_USER=${{ vars.JFROG_USERNAME }}' -var 'JFROG_FRONTEND_TOKEN=${{ secrets.JFROG_FRONTEND_TOKEN }}' -var 'run_number=${{ github.run_number }}' -var 'docker_image=${{ vars.JFROG_REGISTRY }}/react-frontend/react:${{ needs.repo-meta.outputs.image_name }}'
 
      - name: Deploy frontend app
        working-directory: ./deploy-frontend
        run: |
          terraform apply -auto-approve -var 'JFROG_REGISTRY=${{ vars.JFROG_REGISTRY }}' -var 'JFROG_USER=${{ vars.JFROG_USERNAME }}' -var 'JFROG_FRONTEND_TOKEN=${{ secrets.JFROG_FRONTEND_TOKEN }}' -var 'run_number=${{ github.run_number }}' -var 'docker_image=${{ vars.JFROG_REGISTRY }}/react-frontend/react:${{ needs.repo-meta.outputs.image_name }}'


  